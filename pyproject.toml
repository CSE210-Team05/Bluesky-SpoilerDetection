[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky-spoiler-detection"
version = "0.1.0"
description = "Queue-based Bluesky spoiler detection pipeline"
requires-python = ">=3.11"
dependencies = [
    "websockets>=16,<18",
]

[project.scripts]
spoiler-pipeline = "coordinator:main"

[tool.setuptools]
py-modules = ["coordinator"]

[tool.setuptools.packages.find]
include = [
    "Bluesky_interface*",
    "label_publisher*",
    "metrics*",
    "spoiler_interface*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: browser tests that exercise the complete local pipeline",
]

[tool.pylint.basic]
# Follow normal Python naming while preserving the detector's required public API.
argument-naming-style = "snake_case"
attr-naming-style = "snake_case"
const-naming-style = "UPPER_CASE"
function-naming-style = "snake_case"
method-naming-style = "snake_case"
variable-naming-style = "snake_case"
# ``status_code`` mirrors the public requests.Response attribute in protocol
# doubles and must retain that external spelling.
good-names = ["tmp_path", "status_code", "isSpoiler", "do_GET", "do_HEAD"]

# Setting Class names to PascalCase
class-naming-style = "PascalCase"
# Class-level constants use UPPER_CASE; ordinary class attributes use snake_case.
class-attribute-rgx = "^(_?[A-Z][A-Z0-9_]*|_?[a-z][a-z0-9_]*)$"

# Python modules and packages use Python's conventional snake_case naming.
module-naming-style = "snake_case"
module-rgx = "^(Bluesky_interface|[a-z_][a-z0-9_]*)$"

[tool.pylint.messages_control]
# Fatal errors, correctness errors, and naming are enforced. CI treats every
# enabled finding as an error; style rules can be enabled incrementally.
disable = ["all"]
enable = ["E", "F", "invalid-name"]

[tool.pylint.typecheck]
# This member exists only on Windows, so it is absent when Pylint runs on Linux/macOS.
generated-members = ["signal.CTRL_BREAK_EVENT"]
